<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Tech Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 24px 16px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
        }

        main {
            width: min(1100px, 92%);
            margin: 30px auto;
        }

        h2 {
            margin-top: 0;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        .product-icon {
            font-size: 54px;
            margin-bottom: 12px;
        }

        .product-card h3 {
            margin: 8px 0;
        }

        .price {
            font-weight: bold;
            margin: 12px 0;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-button {
            background: #2563eb;
            color: white;
        }

        .add-button:hover {
            background: #1d4ed8;
        }

        .cart-section {
            margin-top: 36px;
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        .cart-item {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid #ddd;
            padding: 14px 0;
        }

        .remove-button {
            background: #dc2626;
            color: white;
        }

        .remove-button:hover {
            background: #b91c1c;
        }

        .cart-summary {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 2px solid #ddd;
        }

        .empty-message {
            color: #666;
        }

        footer {
            margin-top: 40px;
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 850px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .product-grid {
                grid-template-columns: 1fr;
            }

            .cart-item {
                grid-template-columns: 1fr;
                align-items: start;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Mini Tech Store</h1>
    <p>A simple online technology store</p>
</header>

<main>
    <section>
        <h2>Products</h2>

        <div id="product-list" class="product-grid"></div>
    </section>

    <section class="cart-section">
        <h2>Shopping Cart</h2>

        <div id="cart-list"></div>

        <div class="cart-summary">
            <p>
                <strong>Total Quantity:</strong>
                <span id="total-quantity">0</span>
            </p>

            <p>
                <strong>Total Price:</strong>
                <span id="total-price">0 VND</span>
            </p>
        </div>
    </section>
</main>

<footer>
     Tech Store 
</footer>

<script>
    const products = [
        {
            id: 1,
            name: "Wireless Mouse",
            price: 200000,
            icon: "🖱️"
        },
        {
            id: 2,
            name: "Mechanical Keyboard",
            price: 350000,
            icon: "⌨️"
        },
        {
            id: 3,
            name: "Bluetooth Headphones",
            price: 400000,
            icon: "🎧"
        },
        {
            id: 4,
            name: "Webcam",
            price: 300000,
            icon: "📷"
        }
    ];

    const cart = [];

    function formatCurrency(value) {
        return value.toLocaleString("vi-VN") + " VND";
    }

    function renderProducts() {
        const productList = document.getElementById("product-list");

        productList.innerHTML = products.map(product => `
            <article class="product-card">
                <div class="product-icon">${product.icon}</div>

                <h3>${product.name}</h3>

                <p class="price">${formatCurrency(product.price)}</p>

                <button
                    class="add-button"
                    onclick="addToCart(${product.id})"
                >
                    Add to Cart
                </button>
            </article>
        `).join("");
    }

    function addToCart(productId) {
        const selectedProduct = products.find(
            product => product.id === productId
        );

        if (!selectedProduct) {
            return;
        }

        const existingItem = cart.find(
            item => item.id === productId
        );

        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            cart.push({
                ...selectedProduct,
                quantity: 1
            });
        }

        renderCart();
    }

    function removeFromCart(productId) {
        const itemIndex = cart.findIndex(
            item => item.id === productId
        );

        if (itemIndex !== -1) {
            cart.splice(itemIndex, 1);
        }

        renderCart();
    }

    function calculateTotals() {
        const totalQuantity = cart.reduce(
            (sum, item) => sum + item.quantity,
            0
        );

        const totalPrice = cart.reduce(
            (sum, item) => sum + item.price * item.quantity,
            0
        );

        return {
            totalQuantity,
            totalPrice
        };
    }

    function renderCart() {
        const cartList = document.getElementById("cart-list");
        const totalQuantityElement =
            document.getElementById("total-quantity");
        const totalPriceElement =
            document.getElementById("total-price");

        if (cart.length === 0) {
            cartList.innerHTML = `
                <p class="empty-message">
                    Your shopping cart is empty.
                </p>
            `;
        } else {
            cartList.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <strong>${item.name}</strong>

                    <span>
                        Quantity: ${item.quantity}
                    </span>

                    <span>
                        ${formatCurrency(item.price * item.quantity)}
                    </span>

                    <button
                        class="remove-button"
                        onclick="removeFromCart(${item.id})"
                    >
                        Remove
                    </button>
                </div>
            `).join("");
        }

        const totals = calculateTotals();

        totalQuantityElement.textContent =
            totals.totalQuantity;

        totalPriceElement.textContent =
            formatCurrency(totals.totalPrice);
    }

    renderProducts();
    renderCart();
</script>

</body>
</html>
